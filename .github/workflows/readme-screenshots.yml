name: Update README Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

jobs:
  update-screenshots:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture README screenshots
        run: node frontend/scripts/capture-screenshots.mjs
        env:
          SCREENSHOT_URL: https://jameshsims.tech/

      - name: Create pull request for updated screenshots
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update README screenshots"
          branch: automation/readme-screenshots
          base: main
          delete-branch: true
          add-paths: |
            docs/screenshots/
          title: "docs: update README screenshots"
          body: |
            ## Summary
            Automated desktop and mobile screenshot refresh.

            ## Changes
            - Update desktop portfolio screenshot.
            - Update mobile portfolio screenshot.

            Generated automatically by GitHub Actions.
